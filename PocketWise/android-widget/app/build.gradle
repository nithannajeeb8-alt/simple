plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android { namespace 'in.pocketwise.widget'; compileSdk 35
 defaultConfig { applicationId 'in.pocketwise.widget'; minSdk 26; targetSdk 35; versionCode 236; versionName '2.3.36' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
}

dependencies {
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
 if (findProject(':ppocr-sdk') != null) implementation project(':ppocr-sdk')
}
