<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Sign in to your account.">
  <title>Sign in | Account</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body data-page="login">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="page-title">
      <a class="brand" href="index.html" aria-label="Account home">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span>Account</span>
      </a>

      <div class="intro">
        <p class="eyebrow">WELCOME BACK</p>
        <h1 id="page-title">Sign in to your account</h1>
        <p class="muted">Enter your details to continue.</p>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

        <div class="label-row">
          <label for="password">Password</label>
        </div>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password">Show</button>
        </div>

        <button class="primary-button" type="submit" id="login-submit">
          <span class="button-label">Sign in</span>
          <span class="button-spinner" aria-hidden="true"></span>
        </button>
        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <p class="switch-auth">Don't have an account? <a href="register.html">Create one</a></p>
      <p class="footnote">This is a learning project. Keep your account credentials private.</p>
    </section>
  </main>
</body>
</html>
