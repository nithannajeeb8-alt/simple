<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resonant Dust | Portfolio</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #030305; overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* Prevents default scrolling */
            color: white;
        }
        canvas { display: block; }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        .project-text {
            font-size: 1.5rem; letter-spacing: 4px; opacity: 0;
            transition: opacity 2s ease-in-out; text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
        #intro {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #030305; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20;
            transition: opacity 1s; pointer-events: auto;
        }
        button {
            background: transparent; border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 15px 30px; font-size: 1.2rem;
            border-radius: 50px; letter-spacing: 2px; cursor: pointer;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div id="intro">
        <p style="margin-bottom: 20px; color: rgba(255,255,255,0.5);">Experience with Sound & Motion</p>
        <button id="start-btn">ENTER CHAOS</button>
    </div>

    <div id="ui-layer">
        <div id="project-display" class="project-text"></div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const intro = document.getElementById('intro');
        const startBtn = document.getElementById('start-btn');
        const projectDisplay = document.getElementById('project-display');

        let width, height;
        let particles = [];
        let projects = [
            { name: "CASE STUDY 01", hue: 200 },
            { name: "MOTION REEL", hue: 280 },
            { name: "ABOUT ME", hue: 340 }
        ];
        let currentProjectIndex = 0;
        let gyroX = 0, gyroY = 0;
        let audioCtx;

        // Resize Canvas
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Generative Audio (Soothing Sine Waves)
        function playChime(freq, type = 'sine') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            // Soft attack and soothing decay
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 3);
        }

        // Haptics Helper
        function pulseHaptic(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // Particle System
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.baseSize = Math.random() * 1.5 + 0.5;
                this.hue = Math.random() * 40 + 200; // Blue/Cyan base
            }

            update() {
                // Gyroscope Influence (The Predictable)
                this.vx += gyroX * 0.05;
                this.vy += gyroY * 0.05;

                // Center Gravity (The Chaos/Swarm)
                let dx = (width / 2) - this.x;
                let dy = (height / 2) - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    this.vx += (dx / dist) * 0.01;
                    this.vy += (dy / dist) * 0.01;
                }

                // Friction
                this.vx *= 0.98;
                this.vy *= 0.98;

                this.x += this.vx;
                this.y += this.vy;

                // Wrap around edges
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = `hsla(${this.hue}, 80%, 60%, 0.8)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.baseSize, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Chaos
        for (let i = 0; i < 300; i++) particles.push(new Particle());

        function animate() {
            // Low opacity clear for fluid trailing effect (soothing)
            ctx.fillStyle = 'rgba(3, 3, 5, 0.15)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        // --- INTERACTIONS ---

        // 1. Gyroscope
        function handleOrientation(event) {
            // Normalize values for smooth gravity shift
            gyroX = event.gamma / 45 || 0; // Left/Right
            gyroY = (event.beta - 45) / 45 || 0; // Front/Back
        }

        // 2. Touch/Tap (Change Portfolio Item)
        window.addEventListener('touchstart', (e) => {
            if (!audioCtx) return;
            
            // Cycle Project
            currentProjectIndex = (currentProjectIndex + 1) % projects.length;
            let currentProj = projects[currentProjectIndex];

            // Beautiful Chaos Burst
            pulseHaptic([15, 30, 15]); // Heartbeat haptic
            playChime(150 + (currentProjectIndex * 50)); // Base note
            playChime(225 + (currentProjectIndex * 75), 'triangle'); // Harmonic

            // Repel particles from touch point
            const touch = e.touches[0];
            particles.forEach(p => {
                let dx = p.x - touch.clientX;
                let dy = p.y - touch.clientY;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150) {
                    p.vx = (dx / dist) * 15;
                    p.vy = (dy / dist) * 15;
                    p.hue = currentProj.hue; // Shift color to match project
                }
            });

            // Update UI
            projectDisplay.style.opacity = 0;
            setTimeout(() => {
                projectDisplay.innerText = currentProj.name;
                projectDisplay.style.opacity = 1;
            }, 500);
        });

        // Start Experience (Unlocks Device APIs)
        startBtn.addEventListener('click', async () => {
            // Request Gyro for iOS 13+
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                } catch (console) {
                    console.log("Gyroscope permission denied.");
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }

            // Init Audio
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            // UI Transition
            intro.style.opacity = 0;
            setTimeout(() => intro.style.display = 'none', 1000);
            
            // Initial UI Fade In
            projectDisplay.innerText = "TAP TO EXPLORE";
            projectDisplay.style.opacity = 1;

            animate();
        });
    </script>
</body>
</html>
