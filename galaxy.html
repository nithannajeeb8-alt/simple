<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O P T I M I Z E D  C H A O S</title>
    <style>
        /* Anti-Modern Reset */
        *, *::before, *::after { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #030303;
            color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace; /* Brutalist/Raw typography */
            overflow: hidden;
            cursor: crosshair;
        }

        /* SVG Noise Overlay for Texture */
        #noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0.08;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Portfolio Nodes */
        .node {
            position: absolute;
            text-transform: uppercase;
            font-size: clamp(1rem, 2vw, 3rem);
            letter-spacing: -2px;
            white-space: nowrap;
            mix-blend-mode: exclusion;
            user-select: none;
            transition: color 0.1s;
        }

        .node:hover {
            color: #ff003c;
            text-shadow: 2px 2px 0px #00e5ff, -2px -2px 0px #ff003c;
            z-index: 100;
        }

        /* The chaotic cursor trail */
        .trail {
            position: absolute;
            font-size: 10px;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Initialization Screen */
        #boot-screen {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
            cursor: pointer;
        }
        #boot-screen:hover { color: #fff; text-shadow: 0 0 10px #fff; }
    </style>
</head>
<body>

    <div id="noise"></div>
    <div id="boot-screen">[ CLICK TO INITIALIZE CHAOS & AUDIO ]</div>

    <script>
        // --- 1. DATA & DOM SETUP ---
        const sections = [
            "01_ARCHIVE.EXE",
            "02_MANIFESTO.TXT",
            "03_EXPERIMENTS.SYS",
            "04_CONTACT.BAT",
            "NULL_VOID",
            "ERR_404_AESTHETIC"
        ];
        
        const nodes = [];
        let audioCtx, masterGain;
        let isAudioInit = false;

        // --- 2. PROCEDURAL AUDIO ENGINE ---
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.1; // Keep it low, it's harsh
            masterGain.connect(audioCtx.destination);
            
            // Continuous Ambient Drone
            const drone = audioCtx.createOscillator();
            drone.type = 'sine';
            drone.frequency.value = 40; // Deep sub bass
            drone.connect(masterGain);
            drone.start();

            // Modulate drone based on mouse to "optimize chaos"
            window.addEventListener('mousemove', (e) => {
                const freq = 30 + (e.clientY / window.innerHeight) * 100;
                drone.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
            });

            isAudioInit = true;
            document.getElementById('boot-screen').style.display = 'none';
        }

        function playGlitch() {
            if (!isAudioInit) return;
            // Generate a harsh, chaotic clicking/glitching sound
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = Math.random() > 0.5 ? 'sawtooth' : 'square';
            osc.frequency.setValueAtTime(Math.random() * 2000 + 50, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        document.getElementById('boot-screen').addEventListener('click', initAudio);

        // --- 3. PHYSICS & CHAOS ENGINE ---
        // Instead of CSS grids, we use a loop to constantly agitate the elements.
        sections.forEach((text, i) => {
            const el = document.createElement('div');
            el.className = 'node';
            el.innerText = text;
            document.body.appendChild(el);
            
            nodes.push({
                el: el,
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 2, // Velocity X
                vy: (Math.random() - 0.5) * 2, // Velocity Y
                targetX: null,
                targetY: null
            });

            // Trigger chaos sound on interaction
            el.addEventListener('mouseenter', playGlitch);
        });

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // Spawn erratic ASCII trails
            if (Math.random() > 0.5) {
                const trail = document.createElement('div');
                trail.className = 'trail';
                trail.innerText = String.fromCharCode(33 + Math.floor(Math.random() * 94));
                trail.style.left = mouseX + 'px';
                trail.style.top = mouseY + 'px';
                document.body.appendChild(trail);
                
                setTimeout(() => trail.remove(), 500);
            }
        });

        function optimizeChaos() {
            nodes.forEach(node => {
                // Add random jitter (The Chaos)
                node.vx += (Math.random() - 0.5) * 0.5;
                node.vy += (Math.random() - 0.5) * 0.5;

                // Apply friction (The Optimization/Restraint)
                node.vx *= 0.95;
                node.vy *= 0.95;

                // Move
                node.x += node.vx;
                node.y += node.vy;

                // Screen boundaries (Bouncing off walls)
                const bounds = node.el.getBoundingClientRect();
                if (node.x < 0 || node.x + bounds.width > window.innerWidth) node.vx *= -1;
                if (node.y < 0 || node.y + bounds.height > window.innerHeight) node.vy *= -1;

                // Mouse interaction: slightly repel from mouse to make clicking difficult but deliberate
                const dx = node.x - mouseX;
                const dy = node.y - mouseY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 150) {
                    node.vx += dx * 0.002;
                    node.vy += dy * 0.002;
                }

                // Apply transforms
                // We use translate3d to force hardware acceleration while maintaining raw pixel movement
                node.el.style.transform = `translate3d(${node.x}px, ${node.y}px, 0) skew(${node.vx * 2}deg, ${node.vy * 2}deg)`;
            });

            requestAnimationFrame(optimizeChaos);
        }

        optimizeChaos();
    </script>
</body>
</html>
